<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3b52"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dee8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5df28a"/>
      <stop offset="1" stop-color="#1fbf5c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- mouse body -->
  <g filter="url(#shadow)">
    <path fill="url(#body)" d="M512 262
      C 400 262 352 356 352 470
      L 352 606
      C 352 702 424 764 512 764
      C 600 764 672 702 672 606
      L 672 470
      C 672 356 624 262 512 262 Z"/>
  </g>

  <!-- button split -->
  <path d="M512 262 L512 442" stroke="#1a2233" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <path d="M356 442 L668 442" stroke="#1a2233" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>

  <!-- scroll wheel -->
  <rect x="494" y="312" width="36" height="86" rx="18" fill="#1a2233" fill-opacity="0.55"/>

  <!-- charge bolt -->
  <path fill="url(#bolt)" stroke="#0e6f36" stroke-width="6" stroke-linejoin="round"
        d="M534 478 L458 604 L514 604 L490 714 L566 584 L510 584 Z"/>
</svg>
